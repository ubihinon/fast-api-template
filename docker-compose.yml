version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: fastapi_celery_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build: .
    container_name: fastapi_celery_worker
    command: celery -A app.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

  celery_beat:
    build: .
    container_name: fastapi_celery_beat
    command: celery -A app.celery_app beat --loglevel=info
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

  fastapi:
    build: .
    container_name: fastapi_celery_app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

volumes:
  redis_data:

networks:
  fastapi_network:
    driver: bridge

