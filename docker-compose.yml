version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fastapi_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastapi_network

  redis:
    image: redis:7-alpine
    container_name: fastapi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - fastapi_network
# docker-compose down -v && docker-compose build --no-cache && docker-compose up -d && docker-compose logs -f fastapi
  celery_worker:
    build: .
    container_name: fastapi_celery_worker
    command: bash -c "cd /app && celery -A core.celery_app worker --loglevel=info"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONPATH=${PYTHONPATH:-/app/src}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND_URL=${CELERY_RESULT_BACKEND_URL:-redis://redis:6379/1}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

  celery_beat:
    build: .
    container_name: fastapi_celery_beat
    command: bash -c "cd /app && celery -A core.celery_app beat --loglevel=info"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONPATH=${PYTHONPATH:-/app/src}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND_URL=${CELERY_RESULT_BACKEND_URL:-redis://redis:6379/1}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

  fastapi:
    build: .
    container_name: fastapi_app
    command: bash -c "cd /app/.venv/bin/ && uvicorn core.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - ENV_FILE=/app/.env
      - PYTHONPATH=${PYTHONPATH:-/app/src}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND_URL=${CELERY_RESULT_BACKEND_URL:-redis://redis:6379/1}
      - DATABASE_URL=${DATABASE_URL}
      - SYNC_DATABASE_URL=${SYNC_DATABASE_URL}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM=${MAIL_FROM}
      - POSTGRES_HOST=${POSTGRES_HOST:-postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - GRAFANA_LOKI_URL=${GRAFANA_LOKI_URL}
      - GRAFANA_API_USERNAME=${GRAFANA_API_USERNAME}
      - GRAFANA_API_PASSWORD=${GRAFANA_API_PASSWORD}
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_ADMIN=${ENABLE_ADMIN:-true}

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - fastapi_network

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_celery_flower
    command: bash -c "cd /app && celery -A core.celery_app flower --port=5555"
    ports:
      - "5555:5555"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONPATH=${PYTHONPATH:-/app/src}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/0}
      - CELERY_RESULT_BACKEND_URL=${CELERY_RESULT_BACKEND_URL:-redis://redis:6379/1}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

volumes:
  postgres_data:
  redis_data:

networks:
  fastapi_network:
    driver: bridge
