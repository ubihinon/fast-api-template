version: '3.8'

x-logging: &default-logging
  driver: loki
  options:
    loki-url: 'http://loki:3100/loki/api/v1/push'
    loki-pipeline-stages: |
      - multiline:
          firstline: '^\d{4}-\d{2}-\d{2}'
          max_wait_time: 3s
      - json:
          expressions:
            level: levelname
            message: message


services:
  postgres:
    image: postgres:16-alpine
    container_name: fastapi_postgres
    environment:
      POSTGRES_DB: fastapi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastapi_network

  redis:
    image: redis:7-alpine
    container_name: fastapi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build: .
    container_name: fastapi_celery_worker
    command: bash -c "cd /app && celery -A core.celery_app worker --loglevel=info"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONPATH=/app/src
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

  celery_beat:
    build: .
    container_name: fastapi_celery_beat
    command: bash -c "cd /app && celery -A core.celery_app beat --loglevel=info"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONPATH=/app/src
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

  fastapi:
    build: .
    container_name: fastapi_app
    command: bash -c "cd /app/.venv/bin/ && uvicorn core.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONPATH=/app/src
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_db
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/fastapi_db
      - LOKI_URL=http://loki:3100
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      loki:
        condition: service_healthy
      logging: *default-logging
    networks:
      - fastapi_network

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_celery_flower
    command: bash -c "cd /app && celery -A core.celery_app flower --port=5555"
    ports:
      - "5555:5555"
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - PYTHONPATH=/app/src
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki

  grafana:
    image: grafana/grafana:10.4.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      # Автоматическая настройка источника данных Loki
      - GF_DATASOURCES_DEFAULT_URL=http://loki:3100
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    depends_on:
      loki:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  loki_data:
  grafana_data:

networks:
  fastapi_network:
    driver: bridge
