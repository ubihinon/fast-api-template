version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fastapi_postgres
    environment:
      POSTGRES_DB: fastapi_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fastapi_network

  redis:
    image: redis:7-alpine
    container_name: fastapi_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  celery_worker:
    build: .
    container_name: fastapi_celery_worker
    command: bash -c "cd /app && celery -A core.celery_app worker --loglevel=info"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

  celery_beat:
    build: .
    container_name: fastapi_celery_beat
    command: bash -c "cd /app && celery -A core.celery_app beat --loglevel=info"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

  fastapi:
    build: .
    container_name: fastapi_app
    command: uvicorn core.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/fastapi_db
      - SYNC_DATABASE_URL=postgresql+psycopg2://postgres:postgres@postgres:5432/fastapi_db
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - fastapi_network

  flower:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fastapi_celery_flower
    command: bash -c "cd /app && celery -A core.celery_app flower --port=5555"
    ports:
      - "5555:5555"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app/src
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND_URL=redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - fastapi_network

volumes:
  postgres_data:
  redis_data:

networks:
  fastapi_network:
    driver: bridge
