<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{{ _("Welcome!") }}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 5px;
            padding: 20px;
        }
</style>
</head>
<body>
    <div class="container">
        <h2>{% trans email=email %}Hello, {{ email }}!{% endtrans %}</h2>
        <p>{{ _("We are pleased to welcome you to our application. Your account has been successfully created.") }}</p>
        <p>{{ _("If you have any questions, simply reply to this email.") }}</p>
        <hr>
        <p style="font-size: 12px; color: #777777;">{{ _("This is an automated email, please do not reply to it.") }}</p>
    </div>
</body>
</html>
